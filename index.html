<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AstroVrat · CelestialFest</title>
<style>
:root{color-scheme:dark;--bg:#0B0F19;--gold:#E8C872;--silver:#C9D1E0;--card:rgba(255,255,255,.07);--line:rgba(232,200,114,.25);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--silver);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif}
.sky{position:relative;height:230px;overflow:hidden}
.sky canvas{position:absolute;inset:0;width:100%;height:100%}
.sky .t{position:absolute;left:0;right:0;bottom:14px;text-align:center}
h1{margin:0;color:var(--gold);font-size:28px;letter-spacing:.5px}
.sub{font-size:13px;opacity:.85}
main{max-width:960px;margin:0 auto;padding:12px 14px 40px}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-bottom:12px}
button,select{background:var(--card);color:var(--silver);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer}
button:hover{border-color:var(--gold)}
button.g{background:linear-gradient(135deg,#E8C872,#b8923a);color:#1a1405;border:0;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.card h2{margin:0 0 8px;font-size:16px;color:var(--gold)}
.row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed rgba(255,255,255,.08)}
.row:last-child{border:0}
.big{font-size:34px;color:#fff}
.cd{display:flex;gap:6px;margin:6px 0}
.cd div{flex:1;text-align:center;background:rgba(0,0,0,.3);border-radius:8px;padding:6px 0;font-size:20px;color:#fff}
.cd small{display:block;font-size:10px;color:var(--silver)}
.sec{margin:22px 0 10px;color:var(--gold);font-size:18px}
.note{font-size:12px;opacity:.7}
.table{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:420px}
td,th{padding:6px 8px;text-align:left;border-bottom:1px solid rgba(255,255,255,.08)}
#conf{position:fixed;inset:0;pointer-events:none;z-index:9}
#city{background:rgba(0,0,0,.3);color:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;min-width:0;flex:1}
#chatlog{max-height:260px;overflow-y:auto;margin-bottom:10px}
.msg{padding:8px 12px;border-radius:12px;margin:6px 0;white-space:pre-wrap;max-width:90%}
.me{background:rgba(232,200,114,.18);margin-left:auto}
.ai{background:rgba(0,0,0,.3)}
#chatf{display:flex;gap:8px}
#q{flex:1;min-width:0;background:rgba(0,0,0,.3);color:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.card{transition:transform .25s,box-shadow .25s,opacity .6s}
.js .card{opacity:0;transform:translateY(22px)}
.js .card.in{opacity:1;transform:none}
.js .card.in:hover{transform:translateY(-4px);box-shadow:0 8px 28px rgba(232,200,114,.2)}
h1{animation:gl 3s ease-in-out infinite alternate}
@keyframes gl{to{text-shadow:0 0 18px rgba(232,200,114,.75)}}
button{transition:transform .15s,box-shadow .2s}button:active{transform:scale(.94)}button.g:hover{box-shadow:0 0 14px rgba(232,200,114,.6)}
.swing{transform-origin:top center;animation:swing .8s ease 3}
@keyframes swing{0%,100%{transform:rotate(0)}25%{transform:rotate(22deg)}75%{transform:rotate(-22deg)}}
#diyaw{cursor:pointer;text-align:center;-webkit-tap-highlight-color:transparent}
.flame{opacity:0;transform-box:fill-box;transform-origin:50% 100%}.glow{opacity:0;transition:opacity .6s}
.on .flame{opacity:1;animation:fl .15s infinite alternate}.on .glow{opacity:.5}
@keyframes fl{from{transform:scale(1) rotate(-3deg)}to{transform:scale(.9,1.1) rotate(3deg)}}
input[type=range]{accent-color:#E8C872}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.js .card{opacity:1;transform:none}}
.chips button{font-size:13px;padding:5px 10px}
</style>
</head>
<body>
<div class="sky"><canvas id="sky"></canvas>
<div class="t"><h1>🌙 AstroVrat</h1><div class="sub" data-i="tag"></div></div></div>
<main>
<div class="bar">
<span id="loc" class="note"></span>
<span><button id="gps"></button> <button id="lang">हिन्दी</button></span>
</div>
<div class="grid">
<div class="card"><h2 data-i="sun"></h2><div id="sunr"></div></div>
<div class="card"><h2 data-i="moon"></h2><div id="moonr"></div></div>
<div class="card"><h2 data-i="star"></h2><div class="big" id="clar"></div><div class="note" data-i="clnote"></div></div>
<div class="card"><h2 data-i="next"></h2><div class="big" id="nextm">—</div><div class="note" id="nextl"></div></div>
<div class="card"><h2 data-i="tithi"></h2><div class="big" id="tithi"></div><div class="note" data-i="tnote"></div></div>
</div>

<div class="sec" data-i="mp"></div>
<div class="card"><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><canvas id="mc" width="120" height="120"></canvas><div style="flex:1;min-width:200px"><div class="big" id="mdate"></div><div id="minfo" style="margin-bottom:8px"></div><div style="display:flex;gap:8px;align-items:center"><button id="mplay">▶</button><input type="range" id="msl" min="-15" max="15" value="0" style="flex:1"></div></div></div></div>

<div class="sec" data-i="fest"></div>
<div class="grid" id="fests"></div>

<div class="sec" data-i="fam"></div>
<div class="card">
<div class="bar"><input id="city" list="cl" placeholder="Search city / शहर खोजें" autocomplete="off"><datalist id="cl"></datalist><button id="add" data-i="add"></button><button id="wa" class="g" data-i="share"></button></div>
<div class="table"><table><thead><tr><th data-i="city"></th><th data-i="moonrise"></th><th data-i="sunset"></th></tr></thead><tbody id="fam"></tbody></table></div>
<div class="note" data-i="ist"></div>
<div id="shbox"></div>
</div>

<div class="sec" data-i="chk"></div>
<div class="card" id="chkbox"></div>

<div class="sec" data-i="ask"></div>
<div class="card" id="aicard">
<div class="chips" id="chips"></div>
<div id="chatlog"></div>
<div id="chatf"><input id="q" autocomplete="off"><button id="send" class="g">➤</button></div>
<div class="note" data-i="ainote"></div>
</div>

<div class="sec" data-i="pooja"></div>
<div class="card" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><div id="diyaw"><svg viewBox="0 0 120 100" width="120" height="100"><circle class="glow" cx="60" cy="42" r="40" fill="#ffb347"/><path d="M18 68 Q60 108 102 68 Z" fill="#b8923a"/><path class="flame" d="M60 18 Q74 40 60 60 Q46 40 60 18Z" fill="#ffd45e"/></svg><div class="note" data-i="diya"></div></div><div><button id="bell" class="g"><span id="bi" style="display:inline-block">🔔</span> <span data-i="bell"></span></button> <button id="shankh">🐚 <span data-i="shankh"></span></button></div></div>
</main>
<canvas id="conf"></canvas>

var lang="en",pos={name:"Meerut",lat:28.98,lng:77.71};
var CITIES=[["Delhi",28.61,77.21],["Mumbai",19.08,72.88],["Kolkata",22.57,88.36],["Chennai",13.08,80.27],["Jaipur",26.91,75.79],["Lucknow",26.85,80.95],["Patna",25.59,85.14],["Meerut",28.98,77.71],["Ahmedabad",23.02,72.57],["Hyderabad",17.39,78.49],["Bengaluru",12.97,77.59],["Pune",18.52,73.86],["Bhopal",23.26,77.41],["Chandigarh",30.73,76.78],["Varanasi",25.32,82.99],["Dehradun",30.32,78.03],["Ranchi",23.34,85.31]];

var FEST=[["Dhanteras","धनतेरस","2026-11-06"],["Diwali","दिवाली","2026-11-08"],["Bhai Dooj","भाई दूज","2026-11-11"],["Makar Sankranti","मकर संक्रांति","2027-01-14"],["Maha Shivratri","महाशिवरात्रि","2027-03-06"],["Holi","होली","2027-03-22"],["Ram Navami","राम नवमी","2027-04-15"],["Chhath Puja","छठ पूजा","2026-11-15"],["Dev Diwali","देव दिवाली","2026-11-24"],["Sharad Purnima","शरद पूर्णिमा","2027-10-15"],["Karwa Chauth","करवा चौथ","2027-10-18"]];

var R=Math.PI/180,E=R*23.4397,PI=Math.PI;
function days(t){return t/864e5-0.5+2440588-2451545}
function ra(l,b){return Math.atan2(Math.sin(l)*Math.cos(E)-Math.tan(b)*Math.sin(E),Math.cos(l))}

 var l=L+R*(6.289*Math.sin(Mp)-1.274*Math.sin(2*D-Mp)+0.658*Math.sin(2*D)-0.186*Math.sin(Ms)+0.059*Math.sin(2*Mp-2*D));
 l=l-R*(0.057*Math.sin(2*D-Ms-Mp)+0.053*Math.sin(2*D+Mp)+0.046*Math.sin(2*D-Ms)+0.041*Math.sin(Mp-Ms)-0.035*Math.sin(D)-0.031*Math.sin(Mp+Ms)-0.015*Math.sin(2*F-2*D+Mp));
 var b=R*(5.128*Math.sin(F)+0.28*Math.sin(Mp+F)+0.277*Math.sin(Mp-F)+0.173*Math.sin(2*D-F)+0.055*Math.sin(2*Mp-F));

 return{ra:ra(l,b),dec:dc(l,b),dist:dist}}

function dayStart(){return Math.floor((Date.now()+19800000)/864e5)*864e5-19800000}

 return{rise:r,set:s}}

 for(var i=0;i<30;i++){m=(a+b)/2;fm=fn(m,la,ln);if((fa<0)!==(fm<0)){b=m;fb=fm}else{a=m;fa=fm}if(Math.abs(fm)<2e-4||Math.abs(b-a)<500)break}

 document.querySelectorAll("[data-i]").forEach(function(e){e.textContent=tr(e.dataset.i)});

 e.innerHTML=[[D,"d"],[H,"h"],[Mi,"m"],[Se,"s"]].map(function(x){return"<div>"+x[0]+"<small>"+tr(x[1])+"</small></div>"}).join("")})}
